name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install X11 development packages
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxft-dev libfontconfig1-dev xvfb
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        # -noreset: Xvfb otherwise resets when its last client disconnects and
        # refuses connections meanwhile, failing tests that open a new App
        # right after destroying one.
        run: xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" go test -race -short ./...

  windows-vet:
    # The Windows backend is pure Go (syscall), so it can be checked from Linux.
    runs-on: ubuntu-latest
    env:
      GOOS: windows
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -short ./...
